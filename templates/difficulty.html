{% extends "base.html" %}

{% block content %}
    <section class="difficulty-content" aria-labelledby="difficulty-title">
    <h1 id="difficulty-title">Choose your game</h1>
    <p class="page-subtitle">Select a difficulty and who should go first.</p>
    
    <form action="/SetDifficulty" method="POST" class="settings-form">
        <fieldset>
            <legend>Difficulty</legend>
            <input type="radio" name="difficulty" id="easy" value="EASY" class="hidden-radio" required>
            <label for="easy" class="btn">Novice</label>

            <input type="radio" name="difficulty" id="medium" value="MEDIUM" class="hidden-radio">
            <label for="medium" class="btn">Master</label>

            <input type="radio" name="difficulty" id="hard" value="HARD" class="hidden-radio" checked>
            <label for="hard" class="btn">Impossible</label>
        </fieldset>
        
        <fieldset>
            <legend>Who goes first?</legend>
            <input type="radio" name="first_player" id="first_human" value="HUMAN" class="hidden-radio" required checked>
            <label for="first_human" class="btn">You</label>

            <input type="radio" name="first_player" id="first_npc" value="NPC" class="hidden-radio">
            <label for="first_npc" class="btn">Computer</label>
        </fieldset>

        <button type="submit" class="submit-btn">Let's Play!</button>
    </form>
    
    <button type="button" class="backbutton" onclick="window.location.href='/'">Back</button>
    </section>
{% endblock %}
